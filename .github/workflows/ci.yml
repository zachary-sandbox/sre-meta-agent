name: CI Pipeline

on:
  push:
    branches: [ "main", "release/*", "deploy/*" ]
  pull_request:
    branches: [ "main", "release/*", "deploy/*" ]
  workflow_dispatch:

# [NEW] Concurrency control to cancel redundant/duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest suite
      run: |
        python -m pytest tests/ -v
      env:
        # 1. Secrets (Sensitive Data)
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-dummy' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-dummy' }}
        
        # 2. Variables (Non-sensitive Configuration)
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
        LLM_MODEL_NAME: ${{ vars.LLM_MODEL_NAME || 'claude-3-haiku-20240307' }}
        LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0' }}
        ANTHROPIC_API_BASE: ${{ vars.ANTHROPIC_API_BASE || '' }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || '' }}
        DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE || 'https://api.deepseek.com' }}
        OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
        
        # 3. Static CI Configurations
        LANGCHAIN_TRACING_V2: "false"
        BACKEND_API_URL: "http://127.0.0.1:8000"
        KUBECONFIG_PATH: "/tmp/dummy-kubeconfig"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Log in to Docker Hub
    # Only runs on push events to prevent PRs from failing due to missing secrets
    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and Push Backend Image
    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.backend
        # Only push if the event is a push. PRs will only build.
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/sre-meta-agent-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/sre-meta-agent-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Build and Push Frontend Image
    - name: Build and Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.frontend
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/sre-meta-agent-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/sre-meta-agent-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max