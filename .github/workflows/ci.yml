name: CI Pipeline

on:
  push:
    branches: [ "main", "release/*", "deploy/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "release/*", "deploy/*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    environment: sre-meta-agent
    
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'dummyuser' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest suite
      run: |
        python -m pytest tests/ -v
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-dummy' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-dummy' }}
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
        LLM_MODEL_NAME: ${{ vars.LLM_MODEL_NAME || 'claude-3-haiku-20240307' }}
        LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0' }}
        LANGCHAIN_TRACING_V2: "false"
        BACKEND_API_URL: "http://127.0.0.1:8000"
        KUBECONFIG_PATH: "/tmp/dummy-kubeconfig"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ==========================================
    # Stage 1: Extract Metadata (Tags & Labels)
    # ==========================================
    - name: Extract Metadata for Backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_USERNAME }}/sre-meta-agent-backend
        tags: |
          # Generate semver tags (e.g., v0.3.0, 0.3)
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Generate latest tag only for the default branch (main)
          type=raw,value=latest,enable={{is_default_branch}}
          # Generate short commit hash tag for exact tracing
          type=sha,format=short

    - name: Extract Metadata for Frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_USERNAME }}/sre-meta-agent-frontend
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=short

    # ==========================================
    # Stage 2: Login to Docker Hub
    # ==========================================
    # ONLY login on main branch pushes or version tags.
    # Deploy branches and PRs will NOT trigger login.
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    # ==========================================
    # Stage 3: Build and Push Images
    # ==========================================
    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.backend
        # ONLY push on main branch or tags
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.frontend
        # ONLY push on main branch or tags
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max