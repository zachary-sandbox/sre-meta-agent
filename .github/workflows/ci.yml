name: CI Pipeline

on:
  push:
    branches: [ "main", "release", "develop" ]
  pull_request:
    branches: [ "main", "release", "develop" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest suite
      run: |
        python -m pytest tests/ -v
      env:
        # ==========================================
        # 1. Secrets (Sensitive Data) - All Providers
        # ==========================================
        # Provide all keys. If a secret is missing, fallback to a dummy key to prevent init crashes.
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-dummy' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-dummy' }}
        
        # ==========================================
        # 2. Dynamic Variables (Non-sensitive Config)
        # ==========================================
        # Default to anthropic, but can be changed in GitHub Repository Variables
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
        LLM_MODEL_NAME: ${{ vars.LLM_MODEL_NAME || 'claude-3-haiku-20240307' }}
        LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0' }}
        
        # Optional custom endpoints (useful for proxies)
        ANTHROPIC_API_BASE: ${{ vars.ANTHROPIC_API_BASE || '' }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || '' }}
        DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE || 'https://api.deepseek.com' }}
        OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
        
        # ==========================================
        # 3. Static CI Configurations
        # ==========================================
        LANGCHAIN_TRACING_V2: "false"
        BACKEND_API_URL: "http://127.0.0.1:8000"
        KUBECONFIG_PATH: "/tmp/dummy-kubeconfig" # Dummy path for CI tests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.backend
        push: false
        tags: sre-meta-agent-backend:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.frontend
        push: false
        tags: sre-meta-agent-frontend:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max